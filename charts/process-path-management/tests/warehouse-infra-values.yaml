# Mirror of what warehouse-infra sets for process-path-management
# (helm-values/_platform.yaml + helm-values/process-path-management.yaml +
# helm-values/kind-resources/process-path-management.yaml on origin/develop,
# 2026-10-19), trimmed to the keys that matter for the real runtime.
# tests/render_test.sh renders the chart with this file and asserts it still
# works after ADR 0037: infra needs NO values change.
replicaCount: 1
config:
  httpAddr: ":8080"
  eventPublisher: kafka
kafka:
  # infra passes the string 'true' (and the brokers come from _platform.yaml)
  enabled: 'true'
  brokers: kafka.warehouse-systems.svc.cluster.local:9092
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 6
readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 3
  periodSeconds: 5
  failureThreshold: 3
analytics:
  database:
    existingSecret: process-path-management-analytics-db
  enabled: true
  reports:
    route:
      enabled: true
      path: /api/process-path-management/reports
      parentRefs:
        - name: warehouse-gateway
          namespace: kong
          sectionName: http
    resources:
      requests:
        cpu: 25m
  projector:
    resources:
      requests:
        cpu: 25m
database:
  existingSecret: process-path-management-db
extraEnv: []
frontend:
  enabled: true
  image:
    pullPolicy: IfNotPresent
    repository: warehouse/process-path-management-frontend
  resources:
    requests:
      cpu: 25m
gatewayApi:
  enabled: true
  parentRefs:
    - name: warehouse-gateway
      namespace: kong
      sectionName: http
  hosts:
    - path: /api/process-path-management
      pathType: PathPrefix
  stripPath: true
image:
  pullPolicy: IfNotPresent
  repository: warehouse/process-path-management
ingress:
  annotations:
    konghq.com/strip-path: 'true'
  className: kong
  enabled: false
  hosts:
    - host: ''
      paths:
        - path: /api/process-path-management
          pathType: Prefix
kongPlugins:
  cors:
    enabled: true
    origin: http://localhost
  opentelemetry:
    enabled: true
  prometheus:
    enabled: true
mcp:
  enabled: true
  route:
    enabled: true
    path: /api/mcp/process-path-management
    parentRefs:
      - name: warehouse-gateway
        namespace: kong
        sectionName: http
  resources:
    requests:
      cpu: 25m
pathCatalogue:
  content: ''
  enabled: false
resources:
  requests:
    cpu: 25m
service:
  port: 80
  targetPort: 8080
  type: ClusterIP
