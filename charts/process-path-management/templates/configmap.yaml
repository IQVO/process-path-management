apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "process-path-management.fullname" . }}
  labels:
    {{- include "process-path-management.labels" . | nindent 4 }}
data:
  HTTP_ADDR: {{ .Values.config.httpAddr | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  ENVIRONMENT: {{ .Values.environment | quote }}
  CORS_ALLOWED_ORIGINS: {{ .Values.config.corsAllowedOrigins | quote }}
  EVENT_PUBLISHER: {{ .Values.config.eventPublisher | quote }}
  # ADR 0030: failed sends after which the relay stops claiming an outbox
  # row. "0" = unlimited.
  OUTBOX_MAX_ATTEMPTS: {{ .Values.config.outboxMaxAttempts | quote }}
  {{- if .Values.otel.enabled }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.otel.endpoint | quote }}
  OTEL_SERVICE_NAME: {{ .Values.otel.serviceName | quote }}
  {{- end }}
  {{- if .Values.kafka.enabled }}
  KAFKA_BROKERS: {{ .Values.kafka.brokers | quote }}
  {{- end }}
