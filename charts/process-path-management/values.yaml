# Default values for process-path-management.

replicaCount: 1

image:
  repository: process-path-management
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: process-path-management.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Additive, disabled-by-default alternative to the ingress: block above.
# Mirrors the shape every other chart in this fleet now ships (see
# fulfillment-execution's charts/fulfillment-execution/templates/httproute.yaml
# for the reference this was copied from). Routes only to this chart's
# main REST API Service — the same Service ingress.yaml already targets.
gatewayApi:
  enabled: false
  parentRefs:
    - name: ""
      namespace: ""
      sectionName: "http"
  hosts:
    - path: /
      pathType: PathPrefix
  stripPath: true

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# HorizontalPodAutoscaler (autoscaling/v2) per independently-scalable
# workload type, mirroring order-management's ADR 0026 (the fleet's
# Phase 3 scalability reference PR #110). Every block below defaults
# `enabled: false` so this PR cannot silently change production replica
# behaviour on merge. When a component's autoscaling.<x>.enabled=true,
# that Deployment's own replicaCount / analytics.<x>.replicaCount value
# is OMITTED from the rendered manifest (see each deployment template's
# `{{- if not .Values.autoscaling.<x>.enabled }}` guard) so the HPA
# controller is the SOLE owner of .spec.replicas -- a hardcoded
# `replicas:` field competing with the HPA would otherwise fight it on
# every reconcile.
#
# mcp deliberately has NO block here (skipped, not just disabled): its
# StreamableHTTPHandler (github.com/modelcontextprotocol/go-sdk/mcp)
# keeps a per-process, in-memory `sessions map[string]*sessionInfo`
# keyed by the MCP protocol's own Mcp-Session-Id header (see that
# package's streamable.go) -- a real multi-request session, not just a
# TCP/HTTP connection. charts/process-path-management/templates/
# mcp-service.yaml is a plain ClusterIP Service with no sessionAffinity
# configured, so a second request carrying the same Mcp-Session-Id
# (e.g. a tools/call following an earlier initialize) could be routed
# by kube-proxy to a DIFFERENT pod than the one that created the
# session, which has never heard of it. Fixing this for real needs
# either sessionAffinity: ClientIP (a partial mitigation only) or
# wiring the SDK's StreamableHTTPOptions.EventStore to a shared/
# external session store -- a real code change out of scope for this
# chart-and-pgxpool-tuning PR. mcp.replicaCount therefore stays a
# plain, un-autoscaled value (see mcp: below); revisit if/when the SDK
# wiring adopts Stateless mode or an external session store.
autoscaling:
  # cmd/pathmgmt (this Deployment): stateless OLTP HTTP service with
  # NO inbound Kafka consumer at all (this service is the published-
  # language SOURCE, never a consumer -- see AGENTS.md) -- no
  # per-process session or cache state whatsoever. Its only background
  # work is the in-process OutboxRelay (postgres.OutboxRelay), which
  # claims rows via `SELECT ... FOR UPDATE SKIP LOCKED ORDER BY id` --
  # explicitly documented (outbox_relay.go) as safe for two or more
  # relay instances running concurrently during a rolling deploy, so N
  # steady-state replicas share the same safety property. Nothing here
  # is unsafe at N>1. max 4 / target 70% CPU, matching order-management
  # api's numbers.
  api:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
  # cmd/pathmgmt-projector: this service's ONLY inbound Kafka consumer
  # (internal/adapters/inbound/kafka/analytics_consumer.go), reading
  # its OWN analytics topic under kafka.AnalyticsConsumerGroup ==
  # "process-path-management-analytics" -- a STABLE, shared consumer-
  # group name with no per-instance uniqueness, the fleet's correctly-
  # scalable pattern -- so N replicas legitimately share the topic's
  # partitions via normal Kafka rebalancing, not a collision risk.
  # Capped at 2, not left at api's 4, mirroring order-management's
  # analytics-projector reasoning exactly: (a) every write is already
  # idempotent on event_id via the ProcessedEvents dedupe gate before
  # the projection apply, so correctness does not regress at 2 replicas;
  # (b) it is a lightweight, mostly-idempotent-upsert catalogue-growth
  # projection workload with no throughput case yet that justifies
  # wider fan-out than 2.
  projector:
    enabled: false
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 70
  # cmd/pathmgmt-reports: stateless read-only REST reader over its own
  # read-only pgxpool (analyticsstore.NewReadOnlyPool) -- no in-memory
  # state, no Kafka consumption, safe to run N independent copies of.
  # Same treatment as api. max 3 / target 70% CPU, matching
  # order-management analytics-reports.
  reports:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
  # frontend (web/, nginx-unprivileged serving the built SPA bundle):
  # pure static-asset serving, no server-side session or per-request
  # state whatsoever -- the most trivially horizontally scalable
  # workload in this chart. max 3 / target 70% CPU, matching
  # order-management frontend.
  frontend:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70

# deployment.environment.name on every span, metric and log this service
# exports. Set per-cluster (local / staging / production).
environment: "local"

# Falls back to in-memory adapters when database.url / database.existingSecret
# are left empty, same as running the binary locally with no env vars set.
# This service has no inbound Kafka consumer (see README) — it is the
# SOURCE of the process-path published language, not a consumer — so
# there is no consumer-group config to expose here, unlike labor-performance.
config:
  httpAddr: ":8080"
  migrationsPath: "migrations"
  logLevel: "info"        # debug | info | warn | error
  corsAllowedOrigins: "http://localhost:5173,http://localhost:5189"
  # "log" (default) or "kafka" — gates whether ProcessPath* events are
  # published onto warehouse.process-path-management.events at all.
  eventPublisher: "log"

database:
  url: ""
  existingSecret: ""
  existingSecretKey: "DATABASE_URL"

# This service PUBLISHES onto warehouse.process-path-management.events when
# config.eventPublisher is "kafka" (KAFKA_BROKERS is only set in the
# container env in that case). fulfillment-execution, wes-work-planning,
# and workforce-management are the intended consumers of that topic, but
# none of them has wired a consumer yet as of this chart's authoring — see
# docs/docs/ecosystem/context-map.md.
kafka:
  enabled: false
  brokers: "kafka:9092"

# OpenTelemetry traces + metrics, pushed over OTLP/gRPC to a Collector. The
# endpoint below is the in-cluster Collector Service in the warehouse-infra
# kind cluster. Export is non-blocking, so a Collector that is down costs
# telemetry and nothing else — but otel.enabled=false skips the env entirely.
otel:
  enabled: true
  endpoint: "otel-collector.observability.svc.cluster.local:4317"
  serviceName: "process-path-management"

extraEnv: []

# Covers the eager Postgres dial (migrations + pool.Ping) at boot, which is
# now wrapped in a bounded retry (internal/adapters/outbound/bootretry) with
# a budget of ~31s. periodSeconds * failureThreshold gives a ~60s window,
# comfortably past that budget, before the kubelet gives up and restarts the
# pod. Once startupProbe succeeds, liveness/readiness probing takes over.
startupProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 2
  failureThreshold: 30

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    # /readyz (ADR-0012 §graceful shutdown, mirroring order-management's
    # ADR-0025), NOT /healthz: readiness must flip to not-ready during a
    # graceful SIGTERM drain (see cmd/pathmgmt/main.go's shutdown
    # sequence) so this pod stops receiving NEW traffic while it
    # finishes in-flight requests -- /healthz stays a pure liveness
    # signal ("is the process alive") and is deliberately never flipped
    # by shutdown, or Kubernetes would kill the pod mid-drain instead of
    # letting it finish.
    path: /readyz
    port: http
  initialDelaySeconds: 3
  periodSeconds: 5

# Gives cmd/pathmgmt/main.go's graceful shutdown sequence (readiness
# flip -> HTTP drain -> outbox relay clean stop, each bounded by a 10s
# shutdownCtx) enough room to run before Kubernetes SIGKILLs the pod,
# plus margin for the readinessProbe's periodSeconds=5 to have observed
# the not-ready flip before traffic fully stops arriving.
terminationGracePeriodSeconds: 30

# --- MCP server ---
# The Model Context Protocol server (cmd/mcp): a second deployable over the
# same read use cases and OLTP database as the HTTP service, served over
# Streamable HTTP at "/" and "/mcp" with a GET /healthz for the probes.
# Disabled by default so existing releases are unaffected; set
# mcp.enabled=true to deploy it.
#
# Deliberately NOT in the autoscaling: block above -- see that block's
# comment for why (in-memory Mcp-Session-Id state with no sticky
# routing on mcp-service.yaml). mcp.replicaCount stays a plain,
# manually-set value.
mcp:
  enabled: false
  replicaCount: 1
  httpAddr: ":8090"
  service:
    type: ClusterIP
    port: 8090
    targetPort: 8090
  # Overrides the reports base URL the catalogue-growth report tool calls.
  # When empty and analytics.enabled=true, defaults to the in-cluster
  # reports Service.
  reportsBaseUrl: ""
  extraEnv: []
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}

# --- analytics data product (ADR 0007) ---
# The "Process Path Catalogue Growth & Change" report: a separate analytics
# topic, a writer (projector) and a read-only reader (reports), backed by a
# separate analytical database. Disabled by default so existing releases are
# unaffected; set analytics.enabled=true to deploy the two extra processes.
# Requires config.eventPublisher / kafka.enabled=true on the main deployment
# too, or the projector's Kafka topic never receives events to consume.
analytics:
  enabled: false
  # Directory (inside the image) of the analytical *.up.sql migrations the
  # projector applies on start.
  migrationsPath: "migrations/analytics"
  database:
    # The projector's read-write analytical DSN.
    projectorUrl: ""
    # The reader's DSN — a read-only role where possible; falls back to the
    # projector DSN when empty (local/dev).
    reportsUrl: ""
    # Name of an existing Secret with ANALYTICS_DATABASE_URL and
    # ANALYTICS_READER_DATABASE_URL keys. Takes precedence over the URLs
    # above.
    existingSecret: ""
  projector:
    replicaCount: 1
    adminAddr: ":8091"
    # Gives cmd/pathmgmt-projector/main.go's graceful shutdown sequence
    # (readiness flip -> admin-server drain -> analytics consumer clean
    # stop, each bounded by a 10s shutdownCtx) enough room to run before
    # Kubernetes SIGKILLs the pod (ADR-0012 §graceful shutdown).
    terminationGracePeriodSeconds: 30
    # HPA min 1 / max 2 (see the top-level autoscaling.projector block
    # for the full reasoning: AnalyticsConsumerGroup is a stable shared
    # Kafka group, capped at 2 rather than 4 because a lightweight
    # idempotent-upsert workload has no throughput case for wider
    # fan-out yet).
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi
  reports:
    replicaCount: 1
    httpAddr: ":8092"
    # Stateless read-only REST reader over the analytical database (its
    # own read-only pgxpool, analyticsstore.NewReadOnlyPool) -- no
    # in-memory state, safe to run N independent copies of. HPA min 1 /
    # max 3 / target 70% CPU, same treatment as the OLTP api Deployment.
    # See the top-level autoscaling.reports block.
    service:
      type: ClusterIP
      port: 80
      targetPort: 8092
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi

# --- frontend (REMOTE Module Federation remote) ---
# The operator SPA remote, built from web/ and served by its own
# nginx-unprivileged pod. In the kind cluster it is reached through
# warehouse-infra's Nginx web gateway at http://localhost/mfes/process-path-management/
# -- never through Kong, which serves APIs only and must never handle HTML,
# JavaScript, CSS, fonts or images.
#
# Deliberately NO ingress/httproute/gatewayApi block here: frontend path
# routing is owned entirely by the Nginx web gateway, and the Service stays
# ClusterIP so this is not a second host-facing entrypoint.
#
# Disabled by default so existing releases are unaffected; warehouse-infra
# sets frontend.enabled=true and supplies the locally built image tag.
frontend:
  enabled: false
  replicaCount: 1
  image:
    repository: warehouse/process-path-management-frontend
    pullPolicy: IfNotPresent
    tag: ""
  service:
    port: 80
    targetPort: 8080
  # nginx-unprivileged runs as uid/gid 101.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    fsGroup: 101
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
