name: OpenSSF Scorecard

# Fleet-wide bug avoided here (see this fleet's own documented pitfalls):
# this repo's ACTUAL default branch is `develop` (GitFlow), not `main` --
# confirmed via `gh api repos/claudioed/process-path-management -q
# .default_branch`. Scorecard's action refuses to run against a push event
# targeting anything other than the repo's real default branch, so the
# trigger below targets develop, not main.
on:
  push:
    branches: [develop]
  schedule:
    # Scorecard measures repo-level supply-chain hygiene (branch protection,
    # signed commits, dependency pinning, etc.) — a weekly cadence is the
    # project's own recommendation since most inputs change slowly.
    - cron: "0 8 * * 2"
  workflow_dispatch: {}

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write   # upload SARIF to the Security tab
      id-token: write          # publish results to the public Scorecard API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run analysis
        # Pinned to a real release tag, NOT the floating @v2 major tag --
        # ossf/scorecard-action@v2 stopped resolving (only pinned v2.x.x
        # tags exist), a known fleet-wide bug documented in this fleet's
        # ops skill. Do not revert to @v2.
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: results.sarif
