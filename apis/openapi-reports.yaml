openapi: 3.0.3
info:
  title: Process Path Management Reports API
  version: "1.0.0"
  description: >
    The READ-ONLY analytical surface of process-path-management's "Process
    Path Catalogue Growth & Change" data product (ADR 0007), served by the
    separate `cmd/pathmgmt-reports` binary over a read-only Postgres pool
    against the analytical database. It is NOT the OLTP `cmd/pathmgmt` API
    documented in apis/openapi.yaml: a different binary, port and database
    (ADR 0031).


    The report is a projection over this service's own domain events,
    delivered as CloudEvents 1.0 on the
    `warehouse.process-path-management.analytics` topic and applied by
    `cmd/pathmgmt-projector`, the single writer. It is EVENTUALLY
    CONSISTENT: read GET /reports/catalogue-growth/freshness to see how long
    ago the most recently projected change happened.


    Rows are keyed by UTC day bucket. Every counter is a count of events in
    that bucket. No route requires authentication (ADR 0005). Errors use
    RFC 7807 problem details (`application/problem+json`, ADR 0020).
  license:
    name: MIT
  contact:
    name: Process Path Management Team
    url: https://github.com/IQVO/process-path-management
servers:
  - url: http://localhost:8092
    description: Local development (cmd/pathmgmt-reports, HTTP_ADDR default :8092)
tags:
  - name: reports
    description: The Process Path Catalogue Growth & Change analytical read model.
  - name: health
    description: Liveness of the reports process.
paths:
  /healthz:
    get:
      tags: [health]
      operationId: getReportsHealthz
      summary: Liveness probe
      description: >
        Reports that the reports process is up. It does not touch the
        analytical database: the database is pinged once at boot, with the
        bootretry budget, and the process exits when that fails.
      responses:
        "200":
          description: The process is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /reports/catalogue-growth:
    get:
      tags: [reports]
      operationId: getCatalogueGrowthReport
      summary: Process paths defined, revised and deactivated per UTC day
      description: >
        Returns one row per UTC day bucket whose start lies in the half-open
        window [from, to), ordered by day. Days with no catalogue change have no
        row. An empty window is a 200 with an empty `rows` array, never
        `null` and never a 404.
      parameters:
        - name: from
          in: query
          required: true
          description: Inclusive window start, RFC 3339, compared with the day bucket.
          schema:
            type: string
            format: date-time
          example: "2026-09-01T00:00:00Z"
        - name: to
          in: query
          required: true
          description: Exclusive window end, RFC 3339, compared with the day bucket.
          schema:
            type: string
            format: date-time
          example: "2026-10-01T00:00:00Z"
        - name: granularity
          in: query
          required: false
          description: Bucket resolution. Only daily buckets exist; omit it or send `day`.
          schema:
            type: string
            enum: [day]
            default: day
      responses:
        "200":
          description: The report rows for the window.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogueGrowthReport"
        "400":
          description: >
            `from` or `to` is missing or not RFC 3339, or `granularity` is
            not `day` (`invalid-report-query`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: The analytical database could not be read (`report-store-error`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /reports/catalogue-growth/freshness:
    get:
      tags: [reports]
      operationId: getCatalogueGrowthFreshness
      summary: Time since the most recently projected catalogue change
      description: >
        Returns now minus the newest event time the projector has applied,
        or 0 when the read model is empty. The catalogue changes rarely, so
        this grows steadily between operator edits even when the projector
        is fully caught up: it is "time since the last projected change",
        not consumer lag.
      responses:
        "200":
          description: The current freshness lag.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Freshness"
        "500":
          description: The freshness signal could not be read (`report-store-error`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

components:
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          description: Always `ok` when the process answers.
          example: ok

    CatalogueGrowthReport:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          description: One row per UTC day bucket. Always present; empty for a window with no data.
          items:
            $ref: "#/components/schemas/CatalogueGrowthRow"

    CatalogueGrowthRow:
      type: object
      required: [dayBucket, pathsDefined, pathsRevised, pathsDeactivated]
      properties:
        dayBucket:
          type: string
          format: date-time
          description: Start (midnight UTC) of the day this row aggregates.
          example: "2026-09-01T00:00:00Z"
        pathsDefined:
          type: integer
          format: int32
          description: ProcessPathCreated events in the day.
          example: 2
        pathsRevised:
          type: integer
          format: int32
          description: ProcessPathUpdated events in the day.
          example: 1
        pathsDeactivated:
          type: integer
          format: int32
          description: ProcessPathDeactivated events in the day.
          example: 0

    Freshness:
      type: object
      required: [lagSeconds]
      properties:
        lagSeconds:
          type: number
          format: double
          description: >
            Seconds between now and the time of the most recently projected
            event. 0 when the read model is empty.
          example: 1234.5

    Problem:
      type: object
      description: RFC 7807 problem details, the same shape as the OLTP API's.
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          format: uri
          description: Identifier of the error category.
          example: https://errors.process-path-management.warehouse-systems.dev/invalid-report-query
        title:
          type: string
          description: Fixed summary of the error category.
          example: The report query is malformed or missing a required parameter
        status:
          type: integer
          format: int32
          description: The HTTP status code, repeated in the body.
          example: 400
        detail:
          type: string
          description: What went wrong in this request.
          example: "query parameter 'from' is required (RFC3339)"
        instance:
          type: string
          description: The request path.
          example: /reports/catalogue-growth
