# Local dependencies for cmd/pathmgmt, cmd/mcp and cmd/pathmgmt-projector:
# Postgres AND Kafka are the only runtime (ADR 0037), there is no in-memory
# mode. `docker compose up -d --wait` then, for example:
#
#   export DATABASE_URL='postgres://pathmgmt:pathmgmt@localhost:5436/pathmgmt?sslmode=disable'
#   export KAFKA_BROKERS='localhost:9092'
#   go run ./cmd/pathmgmt
#
# The broker (confluent-local, KRaft, single node) advertises localhost:9092
# to the host and auto-creates topics on first write, like the cluster does.
# (Port 9092 is also what the kind cluster's Kafka publishes on the host: stop
# one of the two, or map this one elsewhere and advertise the same address.)
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: pathmgmt
      POSTGRES_PASSWORD: pathmgmt
      POSTGRES_DB: pathmgmt
    ports:
      - "5436:5432"
    volumes:
      - pathmgmt_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pathmgmt"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/confluent-local:7.6.1
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

volumes:
  pathmgmt_pg_data:
